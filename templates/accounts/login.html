{% extends 'base.html' %}
{% block title %}Sign In - GameForge{% endblock %}
{% block auth_content %}
<div class="card gf-card p-4" style="max-width: 440px; width: 100%;">
  <div class="text-center mb-4">
    <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-25 text-primary mb-2">
      <i class="bi bi-controller fs-1"></i>
    </div>
    <h3 class="fw-bold text-white mb-1">GameForge</h3>
    <p class="text-secondary small">Enterprise Game Development Platform</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Username</label>
      {{ form.username }}
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      {{ form.password }}
    </div>
    <button type="submit" class="gf-btn gf-btn-primary w-100 justify-content-center py-2 mt-2">
      <i class="bi bi-box-arrow-in-right"></i> Sign In to Studio
    </button>
  </form>

  <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center text-secondary small">
    Don't have an account? <a href="{% url 'accounts:register' %}" class="text-primary text-decoration-none fw-semibold">Register</a>
  </div>
</div>
{% endblock %}
