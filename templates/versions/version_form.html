{% extends 'base.html' %}
{% block title %}Version Setup - GameForge{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="gf-card">
      <div class="gf-card-header">
        <h4 class="fw-bold mb-0 text-white">Configure Game Version</h4>
      </div>
      <div class="gf-card-body">
        <form method="post">
          {% csrf_token %}
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Game Title</label>
              {{ form.game }}
            </div>
            <div class="col-md-6">
              <label class="form-label">Version SemVer Tag (e.g. v1.2.0)</label>
              {{ form.version_number }}
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">Release Category</label>
              {{ form.release_type }}
            </div>
            <div class="col-md-4">
              <label class="form-label">Lifecycle Status</label>
              {{ form.status }}
            </div>
            <div class="col-md-4">
              <label class="form-label">Target Date</label>
              {{ form.release_date }}
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Release Changelog & Highlights</label>
            {{ form.changelog }}
          </div>
          <button type="submit" class="gf-btn gf-btn-primary"><i class="bi bi-save"></i> Save Version</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
