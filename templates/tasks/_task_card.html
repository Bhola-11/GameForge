<div class="kanban-card">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="badge gf-badge-purple" style="font-size: 0.7rem;">{{ task.get_task_type_display }}</span>
    <span class="gf-badge {% if task.priority == 'CRITICAL' %}gf-badge-danger{% elif task.priority == 'HIGH' %}gf-badge-warning{% else %}gf-badge-neutral{% endif %}" style="font-size: 0.68rem;">
      {{ task.get_priority_display }}
    </span>
  </div>
  <a href="{% url 'tasks:detail' task.pk %}" class="text-white text-decoration-none fw-semibold d-block mb-2">{{ task.title }}</a>
  <div class="text-muted small mb-2" style="font-size: 0.75rem;">{{ task.project.title }}</div>
  
  <div class="border-top border-secondary border-opacity-10 pt-2 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-1 text-secondary small">
      <div class="rounded-circle bg-primary bg-opacity-25 text-primary d-flex align-items-center justify-content-center" style="width: 22px; height: 22px; font-size: 0.65rem;">
        {{ task.assigned_to.username|slice:":1"|upper|default:"?" }}
      </div>
      <span style="font-size: 0.72rem;">{{ task.assigned_to.display_name|truncatechars:12|default:"Unassigned" }}</span>
    </div>
    <span class="text-muted small" style="font-size: 0.72rem;"><i class="bi bi-clock me-1"></i>{{ task.estimated_hours }}h</span>
  </div>
</div>
