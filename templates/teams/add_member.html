{% extends 'base.html' %}
{% block title %}Add Member to {{ team.name }} - GameForge{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="gf-card">
      <div class="gf-card-header">
        <h4 class="fw-bold mb-0 text-white">Add Contributor to {{ team.name }}</h4>
      </div>
      <div class="gf-card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Select Studio Member</label>
            {{ form.user }}
          </div>
          <div class="mb-3">
            <label class="form-label">Squad Role Title</label>
            {{ form.role_in_team }}
          </div>
          <div class="mb-4">
            <label class="form-label">Allocation Percentage (%)</label>
            {{ form.allocation_percentage }}
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="gf-btn gf-btn-primary"><i class="bi bi-person-plus-fill"></i> Add to Squad</button>
            <a href="{% url 'teams:detail' team.pk %}" class="gf-btn gf-btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
