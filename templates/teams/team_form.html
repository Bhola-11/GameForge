{% extends 'base.html' %}
{% block title %}Squad Configuration - GameForge{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="gf-card">
      <div class="gf-card-header">
        <h4 class="fw-bold mb-0 text-white">Configure Development Squad</h4>
      </div>
      <div class="gf-card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Studio / Organization</label>
            {{ form.organization }}
          </div>
          <div class="mb-3">
            <label class="form-label">Squad Name</label>
            {{ form.name }}
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Squad Lead</label>
              {{ form.lead }}
            </div>
            <div class="col-md-6">
              <label class="form-label">Theme Accent Color</label>
              {{ form.color_code }}
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Squad Purpose & Mission</label>
            {{ form.description }}
          </div>
          <button type="submit" class="gf-btn gf-btn-primary"><i class="bi bi-check2"></i> Save Squad</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
