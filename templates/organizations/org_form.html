{% extends 'base.html' %}
{% block title %}Studio Setup - GameForge{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="gf-card">
      <div class="gf-card-header">
        <h4 class="fw-bold mb-0 text-white">Configure Game Studio</h4>
      </div>
      <div class="gf-card-body">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Studio Name</label>
            {{ form.name }}
          </div>
          <div class="mb-3">
            <label class="form-label">Plan Tier</label>
            {{ form.plan_tier }}
          </div>
          <div class="mb-3">
            <label class="form-label">Official Website</label>
            {{ form.website }}
          </div>
          <div class="mb-3">
            <label class="form-label">Studio Overview / Description</label>
            {{ form.description }}
          </div>
          <button type="submit" class="gf-btn gf-btn-primary"><i class="bi bi-check2"></i> Save Organization</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
